---
# role: chronyd
# file: vars/Debian.yml

__chronyd_packages:
  - chrony
  - tzdata
__chronyd_remove_packages:
  - ntp
__chronyd_conf: /etc/chrony/chrony.conf
__chronyd_service: chrony
__chronyd_conflicting_services:
  - systemd-timesyncd
# Pipe the candidate to avoid AppArmor denying Ansible's temporary path.
__chronyd_validate: >-
  /bin/bash -o pipefail -c
  'cat "$1" | /usr/sbin/chronyd -p -f /dev/stdin' -- %s
